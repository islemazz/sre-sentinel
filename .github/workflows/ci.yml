name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and API tests
        run: pytest -q

      - name: Detector quality report (shown in the log)
        run: python -m app.evaluate

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push the image to GitHub's registry (GHCR)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the image (kept local for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sre-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: docker run -d --name sentinel -p 8000:8000 sre-sentinel:ci

      - name: Smoke test the running container
        run: |
          bash scripts/smoke_test.sh http://localhost:8000 || { docker logs sentinel; exit 1; }

      - name: Container must not run as root
        run: |
          uid="$(docker exec sentinel id -u)"
          echo "container user id: $uid"
          test "$uid" != "0"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha


  deploy-gitops:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Point the GitOps repo at the new image
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/islemazz/sre-sentinel-gitops.git" gitops
          cd gitops
          sed -i "s/newTag: .*/newTag: ${TAG}/" apps/sentinel/kustomization.yaml
          git config user.name "sre-sentinel-ci"
          git config user.email "ci@users.noreply.github.com"
          git diff --quiet || { git commit -am "Deploy sre-sentinel ${TAG}"; git push; }
